name: build

on:
  push:
    branches: [main, clips]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release v<__version__> from this commit"
        type: boolean
        default: false
      refresh:
        description: "Re-upload installer + notes to the EXISTING release of this version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      WXWX_TOOLKIT_DATA: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import wxwx_toolkit as w; print(w.__version__)"
          "VERSION=$v" >> $env:GITHUB_ENV
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag $env:GITHUB_REF_NAME does not match __version__ $v"
          }
          if ("${{ inputs.release }}" -eq "true" -and "${{ inputs.refresh }}" -ne "true") {
            gh release view "v$v" -R "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "release v$v already exists - bump __version__ first" }
            $global:LASTEXITCODE = 0
          }

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $out = @(); $on = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { if ($on) { break }; $on = ($l -match "^## v?$([regex]::Escape($env:VERSION))\b") ; continue }
            if ($on) { $out += $l }
          }
          if (-not ($out -join '').Trim()) {
            if ("${{ inputs.release }}" -eq "true" -or $env:GITHUB_REF -like 'refs/tags/v*') { throw "CHANGELOG.md has no section '## $env:VERSION'" }
            $out = @("wxwx toolkit $env:VERSION")
          }
          $out += "", "**Download:** ``wxwx-toolkit-setup.exe`` (installer) or the portable zip below."
          Set-Content release-notes.md ($out -join "`n") -Encoding utf8
          Get-Content release-notes.md

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Shared components download (ffmpeg, yt-dlp)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python -c "from wxwx_toolkit.core import components as c;
          [print(k, c.install(k), c.COMPONENTS[k].version()) for k in ('yt-dlp', 'ffmpeg')];
          assert all(x.installed_locally for x in c.COMPONENTS.values())"

      - name: Add-on tests (addons/*/tests, real ffmpeg)
        shell: pwsh
        run: |
          $ff = python -c "import os; from wxwx_toolkit.core import components as c; print(os.path.dirname(c.COMPONENTS['ffmpeg'].exe()))"
          $env:PATH = "$ff;$env:PATH"
          $env:WX_UI_SMOKE = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:WX_SHOTS = "$pwd"
          foreach ($d in Get-ChildItem addons -Directory) {
            if (Test-Path "$($d.FullName)\tests") {
              Push-Location $d.FullName
              python -m unittest discover -s tests -v
              if ($LASTEXITCODE) { throw "tests failed: $($d.Name)" }
              Pop-Location
            }
          }

      - name: Build add-on zips (addons/*)
        shell: pwsh
        run: |
          python scripts/build_addons.py | Tee-Object built.txt
          if ($LASTEXITCODE) { throw "build_addons failed" }
          $zips = (Get-ChildItem dist/addons/*.zip | ForEach-Object { "--addon"; $_.FullName })
          "ADDON_ARGS=$($zips -join ' ')" >> $env:GITHUB_ENV

      - name: Test clip for the media check (QtMultimedia must decode it)
        run: >
          python -c "import subprocess; from wxwx_toolkit.core import components as c;
          subprocess.run([c.COMPONENTS['ffmpeg'].exe(), '-hide_banner', '-loglevel', 'error', '-y',
          '-f', 'lavfi', '-i', 'testsrc2=s=640x360:r=30:d=3', '-f', 'lavfi', '-i', 'sine=d=3',
          '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-shortest', 'ci-media.mp4'], check=True)"

      - name: Build example add-on
        run: >
          python -c "import zipfile, pathlib; src = pathlib.Path('examples/hello-addon');
          z = zipfile.ZipFile('hello-addon.zip', 'w');
          [z.write(f, f.relative_to(src)) for f in src.rglob('*') if f.is_file() and '__pycache__' not in f.parts]; z.close()"

      - name: Smoke test (real UI, catalog from GitHub, all add-ons, hot update, media)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $a = @('run.py', '--smoke', 'smoke.png', '--addon', 'hello-addon.zip') + ($env:ADDON_ARGS -split ' ') + @('--media', "$pwd\ci-media.mp4")
          python @a
          if ($LASTEXITCODE -ne 0) { throw "smoke test exit code $LASTEXITCODE" }

      - name: Print screenshots as base64 (manual runs only)
        if: ${{ !inputs.release }}
        run: >
          python -c "import base64,glob,textwrap;
          [print('==SHOT '+f+'\n'+'\n'.join(textwrap.wrap(base64.b64encode(open(f,'rb').read()).decode(),3000))+'\n==END') for f in sorted(glob.glob('smoke*.png'))]"

      - name: Build exe
        run: pyinstaller --noconfirm wxwx-toolkit.spec

      - name: Check exe starts and loads an add-on
        shell: pwsh
        run: |
          $al = @('--smoke', "$pwd\exe-smoke.png", '--addon', "$pwd\hello-addon.zip") + ($env:ADDON_ARGS -split ' ') + @('--media', "$pwd\ci-media.mp4")
          $p = Start-Process dist/wxwx-toolkit/wxwx-toolkit.exe -ArgumentList $al -PassThru
          if (-not $p.WaitForExit(200000)) { Stop-Process $p; throw "exe smoke timed out" }
          if ($p.ExitCode -ne 0) { throw "exe smoke exit code $($p.ExitCode)" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\wxwx-toolkit.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          Compress-Archive dist/wxwx-toolkit "dist/wxwx-toolkit-$env:VERSION-portable.zip"
          Copy-Item "dist/wxwx-toolkit-setup-$env:VERSION.exe" dist/wxwx-toolkit-setup.exe
          Get-ChildItem dist -File | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Test install -> reinstall (update) -> uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          $v = $env:VERSION
          $dir = "C:\wxtest"
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          function Run-Wait($file, $argList) {
            $p = Start-Process $file -ArgumentList $argList -PassThru
            if (-not $p.WaitForExit(300000)) { throw "$file timed out" }
            if ($p.ExitCode -ne 0) { throw "$file exit code $($p.ExitCode)" }
          }
          Run-Wait "dist/wxwx-toolkit-setup-$v.exe" ($silent + "/DIR=$dir")
          if (-not (Test-Path "$dir\wxwx-toolkit.exe")) { throw "setup: exe missing" }
          Start-Sleep 4
          if (-not (Get-Process wxwx-toolkit -ErrorAction SilentlyContinue)) { throw "app was not started after silent setup" }
          New-Item "$dir\_internal\stale-from-old-version.dll" -ItemType File | Out-Null
          Run-Wait "dist/wxwx-toolkit-setup-$v.exe" ($silent + '/CLOSEAPPLICATIONS')
          if (Test-Path "$dir\_internal\stale-from-old-version.dll") { throw "stale file survived the update" }
          Start-Sleep 4
          if (-not (Get-Process wxwx-toolkit -ErrorAction SilentlyContinue)) { throw "app was not restarted after update" }
          Get-Process wxwx-toolkit -ErrorAction SilentlyContinue | Stop-Process -Force
          Run-Wait "$dir\unins000.exe" $silent
          Start-Sleep 5
          if (Test-Path "$dir\wxwx-toolkit.exe") { throw "uninstall left the exe" }
          "install / update / uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: wxwx-toolkit-${{ env.VERSION }}
          path: |
            dist/wxwx-toolkit-setup-*.exe
            dist/wxwx-toolkit-*-portable.zip
            dist/addons/*.zip

      - name: Release (tag v* or manual run with "release")
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: wxwx toolkit ${{ env.VERSION }}
          body_path: release-notes.md
          overwrite_files: true
          files: |
            dist/wxwx-toolkit-setup-*.exe
            dist/wxwx-toolkit-setup.exe
            dist/wxwx-toolkit-*-portable.zip
            dist/addons/*.zip
